name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Standalone checks
        run: swift run BonkChecks
      - name: Package app
        run: Scripts/build-app.sh
